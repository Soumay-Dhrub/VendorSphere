spring:
  application:
    name: vendorsphere-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vendorsphere}
    username: ${DB_USER:vendorsphere}
    password: ${DB_PASSWORD:vendorsphere}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

vendorsphere:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-256-bits-for-hmac-sha256}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.vendorsphere: INFO
    org.springframework.security: WARN
