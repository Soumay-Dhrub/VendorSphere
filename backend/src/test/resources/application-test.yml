# Test profile. The datasource URL, username and password are supplied at runtime by
# the Testcontainers PostgreSQL container via @ServiceConnection - never hard-code one
# here, and never point the tests at an external database.
spring:
  jpa:
    hibernate:
      # Validates the entity mappings against the Flyway-migrated schema.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

vendorsphere:
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-hmac-sha256-algorithm

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
