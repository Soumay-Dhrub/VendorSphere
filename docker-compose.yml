services:
  postgres:
    image: postgres:16-alpine
    container_name: vendorsphere-db
    environment:
      POSTGRES_DB: vendorsphere
      POSTGRES_USER: vendorsphere
      POSTGRES_PASSWORD: vendorsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendorsphere -d vendorsphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendorsphere-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vendorsphere
      DB_USER: vendorsphere
      DB_PASSWORD: vendorsphere
      JWT_SECRET: change-me-in-production-use-at-least-256-bits
      # Browser origins allowed to call the API, comma-separated. The frontend container publishes
      # port 3000 on the host, so the browser's origin is still http://localhost:3000 by default.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendorsphere-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
